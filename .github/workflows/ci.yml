name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - run: ./scripts/windows-check.ps1 -ReportDirectory "$env:RUNNER_TEMP/bellows-windows-report"
      - name: Install comparison compiler
        run: rustup toolchain install nightly-2026-01-15 --profile minimal
      - name: Extended native Windows acceptance
        run: ./scripts/windows-extended.ps1 -ReportDirectory "$env:RUNNER_TEMP/bellows-windows-report/extended"
      - name: Teammate installation and first build
        run: ./scripts/install-check.ps1 -ReportDirectory "$env:RUNNER_TEMP/bellows-windows-report/install"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check-results
          path: ${{ runner.temp }}/bellows-windows-report

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --bins --release --locked
      - run: sudo apt-get update && sudo apt-get install -y socat jq
      - run: scripts/local-demo.sh
      - run: scripts/demo.sh
      - run: scripts/five-phase-demo.sh
      - run: scripts/hardening.sh
      - name: Install comparison compiler
        run: rustup toolchain install nightly-2026-01-15 --profile minimal
      - name: Cross-platform extended acceptance
        shell: pwsh
        run: ./scripts/windows-extended.ps1 -ReportDirectory "$env:RUNNER_TEMP/bellows-extended"
      - name: Teammate installation and first build
        shell: pwsh
        run: ./scripts/install-check.ps1 -ReportDirectory "$env:RUNNER_TEMP/bellows-extended/install"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-extended-results
          path: ${{ runner.temp }}/bellows-extended

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag bellows:test .
      - name: Verify container auth policy and health
        run: |
          set -euo pipefail
          wait_healthy() {
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format '{{.State.Health.Status}}' bellows-test)"
              [ "$status" = healthy ] && return 0
              [ "$status" = unhealthy ] && return 1
              sleep 1
            done
            return 1
          }
          docker volume create bellows-test-data >/dev/null
          docker run --detach --name bellows-test \
            --env BELLOWS_AUTH_TOKEN=ci-secret \
            --volume bellows-test-data:/var/lib/bellows \
            bellows:test
          wait_healthy
          docker stop --time 10 bellows-test
          docker rm bellows-test
          docker run --detach --name bellows-test \
            --env BELLOWS_AUTH_TOKEN=ci-secret \
            --volume bellows-test-data:/var/lib/bellows \
            bellows:test
          wait_healthy
          docker stop --time 10 bellows-test
          docker rm bellows-test
          docker volume rm bellows-test-data >/dev/null

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
